# =============================================================================
# PR Checklist Tracker (menggunakan marketplace action, tanpa script custom)
# -----------------------------------------------------------------------------
# Otomatis menambahkan label tracking ke PR berdasarkan status checklist.
# TIDAK memblokir merge — hanya label informatif.
# =============================================================================

name: PR Checklist Tracker

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  track-checklist:
    name: Track Checklist
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Checklist
        uses: preda-bogdan/gha-pr-check-helper@master
        with:
          # false = tidak gagalkan workflow jika PR tidak punya checklist
          requireChecklist: false

          # Hanya periksa body PR (bukan komentar)
          onlyCheckBody: true

          # Label yang ditambahkan otomatis
          completedLabel: "checklist-completed"
          incompleteLabel: "checklist-incomplete"

          # Tambahkan label ini ke PR untuk skip pengecekan
          skipLabel: "allow-checklist-skip"

          # Izinkan item yang di-strikethrough dianggap selesai
          allowStrikeThrough: true
