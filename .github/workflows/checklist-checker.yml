# =============================================================================
# PR Checklist History (console log only)
# =============================================================================

name: PR Checklist History

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  track-checklist:
    name: Track Changes
    runs-on: ubuntu-latest
    steps:
      - name: Track Checklist Changes
        uses: actions/github-script@v8
        with:
          script: |
            function parseChecklist(body) {
              if (!body) return [];
              const items = [];
              for (const line of body.split('\n')) {
                const m = line.match(/^[\s]*-\s+\[([ xX])\]\s+(.*)/);
                if (m) items.push({ checked: m[1].toLowerCase() === 'x', label: m[2].trim() });
              }
              return items;
            }

            const currentItems = parseChecklist(context.payload.pull_request.body);
            const previousItems = parseChecklist(context.payload.changes?.body?.from ?? '');
            const actor = context.payload.sender?.login || 'unknown';
            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
            const pr = context.payload.pull_request.number;

            if (currentItems.length === 0) {
              console.log(`[${timestamp}] PR #${pr} — no checklist found`);
              return;
            }

            const prevMap = new Map(previousItems.map(i => [i.label, i.checked]));

            // On opened/reopened or no previous body — log initial state
            if (!context.payload.changes?.body) {
              console.log(`[${timestamp}] PR #${pr} | user: ${actor} | event: ${context.payload.action}`);
              for (const item of currentItems) {
                console.log(`  ${item.checked ? '✅' : '⬜'} ${item.label}`);
              }
              const checked = currentItems.filter(i => i.checked).length;
              console.log(`  progress: ${checked}/${currentItems.length}`);
              return;
            }

            // Detect changes
            const changes = [];

            for (const item of currentItems) {
              const was = prevMap.get(item.label);
              if (was === undefined) {
                changes.push(`  ➕ added (${item.checked ? 'checked' : 'unchecked'}): ${item.label}`);
              } else if (was !== item.checked) {
                changes.push(`  ${item.checked ? '⬜ → ✅' : '✅ → ⬜'} ${item.label}`);
              }
            }

            for (const item of previousItems) {
              if (!currentItems.some(c => c.label === item.label)) {
                changes.push(`  🗑️ removed: ${item.label}`);
              }
            }

            const checked = currentItems.filter(i => i.checked).length;

            console.log(`[${timestamp}] PR #${pr} | user: ${actor} | progress: ${checked}/${currentItems.length}`);

            if (changes.length > 0) {
              for (const c of changes) console.log(c);
            } else {
              console.log('  no checklist changes');
            }
