# =============================================================================
# PR Checklist History — flat comment version
# =============================================================================

name: PR Checklist History

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  track-checklist:
    name: Track Changes
    runs-on: ubuntu-latest
    steps:
      - name: Track Checklist Changes
        uses: actions/github-script@v8
        with:
          script: |
            const MARKER = '<!-- checklist-history -->';

            function parseChecklist(body) {
              if (!body) return [];
              const items = [];
              for (const line of body.split('\n')) {
                const m = line.match(/^[\s]*-\s+\[([ xX])\]\s+(.*)/);
                if (m) items.push({ checked: m[1].toLowerCase() === 'x', label: m[2].trim() });
              }
              return items;
            }

            const current = parseChecklist(context.payload.pull_request.body);
            const previous = parseChecklist(context.payload.changes?.body?.from ?? '');
            const actor = context.payload.sender?.login || 'unknown';
            const ts = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';

            if (current.length === 0) return;

            // ── Detect changes ────────────────────────────────────────
            const prevMap = new Map(previous.map(i => [i.label, i.checked]));
            const lines = [];

            if (!context.payload.changes?.body) {
              // First time (opened/reopened) — log initial state
              for (const item of current) {
                lines.push(`| ${ts} | @${actor} | ${item.checked ? '✅' : '⬜'} | ${item.label} |`);
              }
            } else {
              for (const item of current) {
                const was = prevMap.get(item.label);
                if (was === undefined) {
                  lines.push(`| ${ts} | @${actor} | ➕ ${item.checked ? '✅' : '⬜'} | ${item.label} |`);
                } else if (was !== item.checked) {
                  lines.push(`| ${ts} | @${actor} | ${item.checked ? '✅' : '⬜'} | ${item.label} |`);
                }
              }
              for (const item of previous) {
                if (!current.some(c => c.label === item.label)) {
                  lines.push(`| ${ts} | @${actor} | 🗑️ | ~~${item.label}~~ |`);
                }
              }
            }

            if (lines.length === 0) return;

            // ── Find existing comment ─────────────────────────────────
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });

            const existing = comments.find(c => c.body.includes(MARKER));

            // ── Parse previous rows ───────────────────────────────────
            let rows = [];
            if (existing) {
              const m = existing.body.match(/<!-- rows -->([\s\S]*?)<!-- \/rows -->/);
              if (m) {
                rows = m[1].trim().split('\n').filter(l => l.startsWith('|'));
              }
            }

            rows.push(...lines);
            if (rows.length > 100) rows = rows.slice(-100);

            // ── Build comment ─────────────────────────────────────────
            const checked = current.filter(i => i.checked).length;

            const body = [
              MARKER,
              `**Checklist** — ${checked}/${current.length}`,
              '',
              '| Timestamp | User | Status | Item |',
              '|-----------|------|--------|------|',
              rows.join('\n')
            ].join('\n');

            // ── Post or update ────────────────────────────────────────
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo
            };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.payload.pull_request.number, body });
            }
